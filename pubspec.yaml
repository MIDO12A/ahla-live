  file_picker: ^8.0.0
  google_fonts: ^6.2.1
  just_audio: ^0.9.40
  flutter_svg: ^2.3.0
  package_info_plus: ^9.0.1
  open_filex: ^4.5.0
  device_info_plus: ^12.4.0
  google_sign_in: ^7.2.0
  video_player: ^2.4.0

