  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.1.0
  image_picker: ^1.2.2
  image_cropper: ^8.0.2
  cached_network_image: ^3.4.0
  flutter_cache_manager: ^3.4.1
  encrypt: ^5.0.3
  provider: ^6.1.5+1
  intl: ^0.20.2
  uuid: ^4.5.3
  archive: ^4.0.9
  flutter_svga: ^0.0.8
  shared_preferences: ^2.5.2
  http: ^1.6.0
  crypto: ^3.0.7
  zego_express_engine: ^3.24.1
  permission_handler: ^11.3.1
  dio: ^5.9.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  restart_app: ^1.8.3
  wakelock_plus: ^1.4.0
  flutter_vap_plugin:
