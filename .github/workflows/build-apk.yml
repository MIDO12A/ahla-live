name: Build & Publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "WARNING: ANDROID_KEYSTORE_BASE64 not set - falling back to debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zero-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=zero
          storeFile=zero-release-key.jks
          EOF

      - name: Read app version
        id: ver
        run: |
          v=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)
          b=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f2)
          echo "ver=$v" >> "$GITHUB_OUTPUT"
          echo "build=$b" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.ver }} --build-number=${{ steps.ver.outputs.build }}

      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk zero-app.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk zero-app-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk zero-app-x86_64.apk
          ls -lh zero-app*.apk

      - name: Create build info
        env:
          APP_VER: ${{ steps.ver.outputs.ver }}
          APP_BUILD: ${{ steps.ver.outputs.build }}
          SHA: ${{ github.sha }}
        run: |
          printf '{"version":"%s","build_number":%s,"commit":"%s"}\n' "$APP_VER" "$APP_BUILD" "$SHA" > build_info.json
          cat build_info.json

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zero-app-v${{ steps.ver.outputs.ver }}-b${{ github.run_number }}
          path: |
            zero-app.apk
            zero-app-arm32.apk
            zero-app-x86_64.apk
            build_info.json
          retention-days: 30

      - name: Publish to GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: Update v${{ steps.ver.outputs.ver }} (Build ${{ github.run_number }})
          body: Auto-build of commit ${{ github.sha }}
          make_latest: true
          overwrite: true
          prerelease: false
          files: |
            zero-app.apk
            zero-app-arm32.apk
            zero-app-x86_64.apk
            build_info.json
          token: ${{ secrets.GITHUB_TOKEN }}
